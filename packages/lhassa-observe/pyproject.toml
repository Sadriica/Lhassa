[project]
name = "lhassa-observe"
version = "0.1.0"
description = "Read-only observers (system, sway, shell, files) that write to Lhassa's history"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "lhassa",
]

[project.entry-points."lhassa.plugins"]
observe = "lhassa.observe.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
