[project]
name = "lhassa-calendar"
version = "0.8.0"
description = "Lhassa calendar pack: ICS feeds, the master-calendar reconcile, .ics events and the $0 calendar-query path"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "lhassa",
    "httpx>=0.27.0",
]

[project.entry-points."lhassa.plugins"]
calendar = "lhassa.calendar.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
