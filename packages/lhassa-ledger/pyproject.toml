[project]
name = "lhassa-ledger"
version = "0.8.0"
description = "Lhassa ledger pack: one append-only, auditable record of what every AI agent on a machine spent and touched (stdlib only)"
license = "AGPL-3.0-or-later"
# The package is stdlib only on purpose and does NOT depend on `lhassa`: the
# Claude Code hook and the Hermes plugin load it inside other programs, with
# whatever Python they run. Keep the floor as low as the code allows.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ledger = "agent_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `agent_ledger` is the library. `adapters/` (hook, Hermes plugin, importer) is
# run from a checkout by path and is not part of the wheel.
packages = ["agent_ledger"]
