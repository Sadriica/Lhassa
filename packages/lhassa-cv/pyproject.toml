[project]
name = "lhassa-cv"
version = "0.8.0"
description = "Lhassa CV pack: tailor a base CV to a job posting (/cv), compile it, track applications"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "lhassa",
]

[project.entry-points."lhassa.plugins"]
cv = "lhassa.cv.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
