[project]
name = "lhassa-bench"
version = "0.8.0"
description = "LhassaBench: fixture-driven eval harness scored only by Lhassa's objective verifiers"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "lhassa",
    "pyyaml>=6.0",
]

[project.entry-points."lhassa.plugins"]
bench = "lhassa.bench.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
