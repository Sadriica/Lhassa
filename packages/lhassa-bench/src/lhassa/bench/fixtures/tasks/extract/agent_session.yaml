# Synthetic data; no real events, people or hosts.
id: task_extract_agent_session
title: 'Extract: agent session'
prompt: |
  Extract the decisions and the to-dos from the notes below. Reply with only JSON of exactly this shape:
  {"decisions": ["..."], "todos": [{"owner": "...", "task": "...", "due": "YYYY-MM-DD or null"}]}
  Rules: list only FINAL decisions that were actually made (not options, not reversed ones). A to-do needs a named owner. Use null when no due date is given. Do not invent items. Today is Monday 2026-03-02.

  Notes:
  Agent session log: the user asked to rotate API keys. The agent decided to rotate only the staging keys now and to defer production to the 2026-03-20 maintenance window. TODO for the user: approve the production rotation.
subject_kind: completion
verify:
  type: json_fields
  required_paths:
  - decisions
  - todos
  lists:
    decisions:
      min: 1
      max: 2
      groups:
      - - staging
      - - production|prod
        - 2026-03-20|defer
    todos:
      min: 1
      max: 1
      groups:
      - - user
        - approve
        - production|prod|rotation
tags:
- task
- extract
- extraction
- json
- hard
- agent-session
max_tokens: 400
reference: '{"decisions": ["Rotate only the staging keys now", "Defer the production rotation to the 2026-03-20
  maintenance window"], "todos": [{"owner": "user", "task": "Approve the production rotation", "due":
  null}]}'
