# Synthetic data; no real events, people or hosts.
id: task_extract_tentative_idea
title: 'Extract: tentative idea'
prompt: |
  Extract the decisions and the to-dos from the notes below. Reply with only JSON of exactly this shape:
  {"decisions": ["..."], "todos": [{"owner": "...", "task": "...", "due": "YYYY-MM-DD or null"}]}
  Rules: list only FINAL decisions that were actually made (not options, not reversed ones). A to-do needs a named owner. Use null when no due date is given. Do not invent items. Today is Monday 2026-03-02.

  Notes:
  Maybe we should rewrite the parser, but nobody committed to it. Pedro will measure the current parse time by 2026-03-10.
subject_kind: completion
verify:
  type: json_fields
  required_paths:
  - decisions
  - todos
  lists:
    decisions:
      max: 0
    todos:
      min: 1
      max: 1
      groups:
      - - pedro
        - parse
        - '2026-03-10'
tags:
- task
- extract
- extraction
- json
- hard
max_tokens: 400
reference: '{"decisions": [], "todos": [{"owner": "Pedro", "task": "Measure the current parse time", "due":
  "2026-03-10"}]}'
bad:
- '{"decisions": ["Rewrite the parser"], "todos": [{"owner": "Pedro", "task": "Measure the current parse
  time", "due": "2026-03-10"}]}'
