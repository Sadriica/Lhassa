# Synthetic data; no real events, people or hosts.
id: task_extract_simple
title: 'Extract: simple'
prompt: |
  Extract the decisions and the to-dos from the notes below. Reply with only JSON of exactly this shape:
  {"decisions": ["..."], "todos": [{"owner": "...", "task": "...", "due": "YYYY-MM-DD or null"}]}
  Rules: list only FINAL decisions that were actually made (not options, not reversed ones). A to-do needs a named owner. Use null when no due date is given. Do not invent items. Today is Monday 2026-03-02.

  Notes:
  Decided: we ship the beta on 2026-04-15. Ana will draft the release notes by 2026-04-01. Luis to book the demo room.
subject_kind: completion
verify:
  type: json_fields
  required_paths:
  - decisions
  - todos
  lists:
    decisions:
      min: 1
      max: 1
      groups:
      - - beta
        - 04-15|april 15
    todos:
      min: 2
      max: 2
      groups:
      - - ana
        - release notes
        - '2026-04-01'
      - - luis
        - demo room
tags:
- task
- extract
- extraction
- json
max_tokens: 400
reference: '{"decisions": ["Ship the beta on 2026-04-15"], "todos": [{"owner": "Ana", "task": "Draft the
  release notes", "due": "2026-04-01"}, {"owner": "Luis", "task": "Book the demo room", "due": null}]}'
