# Synthetic data; no real events, people or hosts.
id: task_extract_shared_owners
title: 'Extract: shared owners'
prompt: |
  Extract the decisions and the to-dos from the notes below. Reply with only JSON of exactly this shape:
  {"decisions": ["..."], "todos": [{"owner": "...", "task": "...", "due": "YYYY-MM-DD or null"}]}
  Rules: list only FINAL decisions that were actually made (not options, not reversed ones). A to-do needs a named owner. Use null when no due date is given. Do not invent items. Today is Monday 2026-03-02.

  Notes:
  Rita and Sam will test the installer on Windows before 2026-03-13.
subject_kind: completion
verify:
  type: json_fields
  required_paths:
  - decisions
  - todos
  lists:
    decisions:
      max: 0
    todos:
      min: 1
      max: 2
      groups:
      - - installer
        - rita
      - - installer
        - sam
      - - '2026-03-13'
tags:
- task
- extract
- extraction
- json
- hard
max_tokens: 400
reference: '{"decisions": [], "todos": [{"owner": "Rita", "task": "Test the installer on Windows", "due":
  "2026-03-13"}, {"owner": "Sam", "task": "Test the installer on Windows", "due": "2026-03-13"}]}'
