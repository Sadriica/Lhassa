# Synthetic data; no real events, people or hosts.
id: task_route_notary_contact
title: 'Route: notary contact'
prompt: |
  You route a user request to exactly one handler.
  Handlers:
  - shell: run commands that inspect or change system state (services, packages, processes, disk usage)
  - code_edit: change source code in a repository (fix bugs, rename, refactor, add tests)
  - web_research: needs current information from the internet
  - calendar: create, move or query events and reminders
  - memory_lookup: recall something the user told the assistant before
  - file_search: locate files by name, content, size or date
  - chat_only: answer from general knowledge or small talk, no tool needed
  Reply with only the handler name, nothing else.

  Request: Who was the contact person at the notary? I told you the name a couple of weeks ago.
subject_kind: completion
verify:
  type: label
  expected: memory_lookup
  labels:
  - shell
  - code_edit
  - web_research
  - calendar
  - memory_lookup
  - file_search
  - chat_only
tags:
