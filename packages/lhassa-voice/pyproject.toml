[project]
name = "lhassa-voice"
version = "0.8.0"
description = "Lhassa voice surface: wake word, STT, a brain turn, TTS over the local audio device"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
# The base install is light on purpose: the pack registers itself and its
# notifier speaker without pipecat. Only lhassa.voice.pipeline (and its
# beep/mute_strategy helpers) need the audio stack, which lives in the
# ``runtime`` extra below.
dependencies = [
    "lhassa",
]

[project.optional-dependencies]
# The voice pipeline (STT, LLM, TTS). Install with
#   uv sync --package lhassa-voice --extra runtime   (core + this pack, with audio)
#   uv sync --all-packages --extra runtime           (everything, with audio)
# Pipecat bundles LLM services for groq, anthropic, openai, openrouter, ollama, cerebras.
# To use CPU-only PyTorch and avoid the large CUDA wheel:
#   uv add --package lhassa-voice torch --extra-index-url https://download.pytorch.org/whl/cpu
runtime = [
    "pipecat-ai[cartesia,deepgram,groq,local,silero]>=0.0.108",
    "torch>=2.0.0",             # required by Silero VAD
]

[project.entry-points."lhassa.plugins"]
voice = "lhassa.voice.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
