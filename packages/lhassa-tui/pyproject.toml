[project]
name = "lhassa-tui"
version = "0.8.0"
description = "Lhassa in a terminal: the Textual app behind `lhassa tui`, reading the brain directly"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "lhassa",
    "textual>=8.2.8",
]

[project.entry-points."lhassa.plugins"]
tui = "lhassa.tui.pack"

[tool.uv.sources]
lhassa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the pack's own subpackage: core owns lhassa/__init__.py.
packages = ["src/lhassa"]
