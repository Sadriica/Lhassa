[package]
name = "lhassa-sentry"
version = "0.1.0"
edition = "2021"
description = "Deterministic ear for Lhassa's monitor watcher, ported to Rust for a small resident footprint. Shadow mode only in v1: read-only, never writes to the brain DB, never launches anything."

[[bin]]
name = "lhassa-sentry"
path = "src/main.rs"

[dependencies]
# Bundled sqlite so the binary needs no system libsqlite3 at runtime.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
