[project]
name = "potts"
version = "0.3.0"
description = "Personal voice AI assistant — voice pipeline, sub-agents, scheduler, dashboard"
requires-python = ">=3.13"
dependencies = [
    # Core
    "aiosqlite>=0.22.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",

    # Voice pipeline (STT → LLM → TTS)
    "pipecat-ai[cartesia,deepgram,groq,local,silero]>=0.0.108",
    "torch>=2.0.0",         # required by Silero VAD

    # LLM / agents
    "groq>=1.0.0",

    # Web tools
    "duckduckgo-search>=8.0.0",
    "httpx>=0.27.0",

    # Dashboard API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Microsoft Graph (Outlook email + calendar)
    "msal>=1.28.0",
]

[project.scripts]
potts = "main:main"

[tool.uv]
# Keep torch CPU-only on systems without CUDA to avoid the 2 GB GPU wheel
# Override locally with: uv add torch --extra-index-url https://download.pytorch.org/whl/cpu
