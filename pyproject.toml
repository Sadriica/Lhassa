[project]
name = "lhassa"
version = "0.8.0"
description = "Lhassa — a personal do-and-sleep AI brain: a heartbeat loop that orchestrates models and harnesses behind interfaces, with memory, an organizational layer, and CLI / Telegram / dashboard / voice surfaces"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # Core
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # LLM clients — used directly by agents (all providers)
    "openai>=1.0.0",            # covers groq (openai-compat), openai, openrouter, ollama, cerebras
    "anthropic>=0.50.0",        # Anthropic Claude direct client
    # Web tools
    "ddgs>=9.0.0", # fallback search when Brave key is not set (successor of duckduckgo-search)
    "httpx>=0.27.0",            # Brave Search, GitHub API, Microsoft Graph
    "pypdf>=4.0.0",             # pure-Python PDF text extraction (memory/extract.py)
    "pyyaml>=6.0",              # SKILL.md frontmatter (skills/skillmd.py); came in via uvicorn[standard] before the api pack
    # Dashboard API (fastapi, starlette, uvicorn) moved to the lhassa-api pack.
    # Microsoft Graph (Outlook email + calendar)
    "msal>=1.28.0",
    "psutil>=7.2.2",
    # Integrations — Model Context Protocol (the official Python SDK).
    # Imported lazily/defensively; the brain works with no MCP servers configured.
    "mcp>=1.0.0",
    # Terminal CLI (lightweight — no voice deps)
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the importable package; main.py stays a top-level script run via `python main.py`.
packages = ["lhassa"]

[project.scripts]
lhassa = "lhassa.cli:main"

# Capability packs live in packages/lhassa-<x> (see packages/README.md); each is
# its own distribution sharing the ``lhassa`` namespace. ``uv sync --all-packages``
# installs core plus every pack; plain ``uv sync`` installs core alone.
[tool.uv.workspace]
members = ["packages/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
# Optional: exact token counting for the memory budget. estimate_tokens() uses
# tiktoken's cl100k_base when present and falls back to a char heuristic otherwise,
# so this is never required — install with `uv sync --extra tokens` to enable it.
tokens = [
    "tiktoken>=0.7.0",
]
# The voice pipeline (pipecat, torch) moved to the lhassa-voice pack, extra
# `runtime`: `uv sync --package lhassa-voice --extra runtime`.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
addopts = "-m \"not integration\""
markers = [
    "integration: real end-to-end tests (live CLI subprocess, real DB file); excluded by default, run with `make test-integration`",
]

[tool.coverage.run]
# Coverage is a separate `make cov` target, never part of the default `make
# test` run — measuring it costs real time (~3-4 min) that the fast default
# suite must not pay.
source = ["lhassa"]
omit = [
    "lhassa/_vendor/*",   # vendored third-party code, not ours to cover
    "*/lhassa/voice/*",   # voice pack: hardware/audio pipeline (pipecat/torch); untestable without mics/speakers
]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.uv]
# torch now comes only through the lhassa-voice pack's `runtime` extra; see
# packages/lhassa-voice/pyproject.toml for the CPU-only wheel note.
