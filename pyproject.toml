[project]
name = "potts"
version = "0.4.0"
description = "Personal voice AI assistant — voice pipeline, multi-provider LLM, sub-agents with tools, scheduler, GitHub, Outlook, dashboard"
requires-python = ">=3.13"
dependencies = [
    # Core
    "aiosqlite>=0.22.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",

    # Voice pipeline (STT → LLM → TTS)
    # Pipecat bundles LLM services for groq, anthropic, openai, openrouter, ollama, cerebras
    "pipecat-ai[cartesia,deepgram,groq,local,silero]>=0.0.108",
    "torch>=2.0.0",             # required by Silero VAD

    # LLM clients — used directly by agents (all providers)
    "openai>=1.0.0",            # covers groq (openai-compat), openai, openrouter, ollama, cerebras
    "anthropic>=0.50.0",        # Anthropic Claude direct client

    # Web tools
    "duckduckgo-search>=8.0.0", # fallback search when Brave key is not set
    "httpx>=0.27.0",            # Brave Search, GitHub API, Microsoft Graph

    # Dashboard API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Microsoft Graph (Outlook email + calendar)
    "msal>=1.28.0",
]

[project.scripts]
potts = "main:main"

[tool.uv]
# To use CPU-only PyTorch and avoid the large CUDA wheel:
#   uv add torch --extra-index-url https://download.pytorch.org/whl/cpu
